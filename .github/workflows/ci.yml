name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adearn
          POSTGRES_PASSWORD: adearn
          POSTGRES_DB: adearn_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: cd server && npm ci

      - name: TypeScript check
        run: cd server && npm run typecheck

      - name: Lint
        run: cd server && npm run lint

      - name: Run migrations
        run: cd server && npm run migrate
        env:
          DATABASE_URL: postgresql://adearn:adearn@localhost:5432/adearn_test

      - name: Run tests
        run: cd server && npm run test:ci
        env:
          DATABASE_URL: postgresql://adearn:adearn@localhost:5432/adearn_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 3000
          FRONTEND_URL: http://localhost:5173
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_TEST }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_TEST }}
          JWT_EXPIRES_IN: 24h
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          OTP_MOCK: true
          OTP_EXPIRY_SECONDS: 120
          EMAIL_MOCK: true
          CASHBACK_MAX_PER_TRANSACTION: 500
          CASHBACK_MIN_PER_TRANSACTION: 1
          FRAUD_SCORE_THRESHOLD: 0.8
          ATTRIBUTION_WINDOW_HOURS: 24
          REDIS_PREFIX: adearn:

      - name: Build
        run: cd server && npm run build
        env:
          DATABASE_URL: postgresql://adearn:adearn@localhost:5432/adearn_test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: TypeScript check
        run: cd web && npm run typecheck

      - name: Lint
        run: cd web && npm run lint

      - name: Build
        run: cd web && npm run build
        env:
          VITE_API_URL: http://localhost:3000/api/v1
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  # ── Webhooks ─────────────────────────────────────────────────────────────

  /webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Stripe webhook handler
      description: |
        Receives Stripe events — primarily `payment_intent.succeeded`.

        **Security:** Validated via `Stripe-Signature` header using
        `stripe.webhooks.constructEvent()`. No Bearer JWT.

        **CRITICAL implementation notes:**
        - Route registered BEFORE `express.json()` — uses `express.raw({ type: 'application/json' })`
        - Returns HTTP 200 immediately; cashback processing runs asynchronously
        - Redis `SETNX` idempotency guard prevents double-processing
        - Fraud score > 0.8 → cashback queued for admin review instead of auto-commit

        **Cashback flow on `payment_intent.succeeded`:**
        1. Verify Stripe signature
        2. Return 200 immediately
        3. Redis SETNX — skip if already processed
        4. SELECT attribution session FOR UPDATE — skip if expired
        5. fraudDetection.score() — queue if > 0.8
        6. cashbackEngine.processCashback() — atomic 5-write transaction
        7. setImmediate: FCM + email + advertiser webhook notifications
      operationId: stripeWebhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: HMAC signature from Stripe for payload verification
          schema:
            type: string
            example: t=1492774577,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a05bd539082b9b5dc7b6b38
      requestBody:
        required: true
        description: Raw Stripe event payload (must NOT be JSON-parsed before signature check)
        content:
          application/json:
            schema:
              type: object
              description: Stripe Event object
              properties:
                id:
                  type: string
                  example: evt_3NxYZ2LkdIwHu7ix0KBJoB0r
                type:
                  type: string
                  example: payment_intent.succeeded
                data:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Webhook received — processing continues asynchronously
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
              example:
                received: true
        '400':
          description: Invalid Stripe signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_SIGNATURE
                  message: Stripe webhook signature verification failed
